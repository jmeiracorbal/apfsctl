name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate release
        run: |
          go test -race ./...
          go vet ./...
          test -z "$(gofmt -l cmd internal)"
          test "$(go list -m)" = "github.com/jmeiracorbal/apfsctl"
          test -d cmd/apfsctl
          test -f ".github/release-notes/${GITHUB_REF_NAME}.md"
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          mkdir -p dist
          for arch in arm64 amd64; do
            mkdir -p "dist/$arch"
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "dist/$arch/apfsctl" ./cmd/apfsctl
            tar -czf "dist/apfsctl_${TAG}_darwin_${arch}.tar.gz" -C "dist/$arch" apfsctl
          done
          (
            cd dist
            shasum -a 256 ./*.tar.gz > checksums.txt
          )
          extra_args=()
          if [[ "$TAG" == *-* ]]; then
            extra_args+=(--prerelease)
          fi
          gh release create "$TAG" dist/*.tar.gz dist/checksums.txt \
            --target "$GITHUB_SHA" \
            --title "apfsctl $TAG" \
            --notes-file ".github/release-notes/${TAG}.md" \
            "${extra_args[@]}"
